<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OSRS Tools Changelog</title>
<link rel="stylesheet" href="shared/theme.css">
<style>
  .doc { max-width: 72ch; }
  .doc h1 { margin-bottom: 8px; }
  .doc h2 { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line); font-size: var(--step-1); }
  .doc h3 { margin-top: 16px; font-size: var(--step-0); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .doc ul { padding-left: 20px; }
  .doc li { margin: 4px 0; }
  nav.crumbs { margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<main class="wrap">
  <nav class="crumbs"><a href="./">← All tools</a><span class="muted" id="which"></span></nav>
  <article class="doc" id="doc"><p class="muted">Loading changelog…</p></article>
</main>
<script>
  // Renders a CHANGELOG.md with the small subset of Markdown the changelogs use:
  // headings, bullet lists, paragraphs, **bold**, `code` and [links](url).
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const inline = s => esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+|[^)\s:]+)\)/g, '<a href="$2">$1</a>');

  function render(md) {
    const out = []; let list = false;
    for (const raw of md.split(/\r?\n/)) {
      const line = raw.trimEnd();
      const h = line.match(/^(#{1,3})\s+(.*)$/);
      const li = line.match(/^\s*[-*]\s+(.*)$/);
      if (!li && list) { out.push("</ul>"); list = false; }
      if (h) out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
      else if (li) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(li[1])}</li>`); }
      else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
    }
    if (list) out.push("</ul>");
    return out.join("\n");
  }

  const tool = new URLSearchParams(location.search).get("tool");
  const safe = tool && /^[a-z0-9-]+$/.test(tool) ? tool : null;
  const path = safe ? `${safe}/CHANGELOG.md` : "CHANGELOG.md";
  document.getElementById("which").textContent = safe ? safe : "Repository";

  fetch(path)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(md => { document.getElementById("doc").innerHTML = render(md); })
    .catch(() => { document.getElementById("doc").innerHTML = '<p class="muted">No changelog found for this tool yet.</p>'; });
</script>
</body>
</html>
